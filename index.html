<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiminalPDF</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="bar">
        <div class="brand" title="LiminalPDF">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 2.75h8.5l4.25 4.25v14.25H6z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" opacity=".85" />
            <path d="M14.5 2.75V7h4.25" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" opacity=".85" />
            <polyline points="9,17.5 9,13.5 13,13.5 13,10.5 21.5,10.5" fill="none" stroke="#b42318" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
          </svg>
          <span class="brand-text">Liminal</span>
        </div>

        <div class="cluster file">
          <button type="button" id="btn-open" title="Abrir PDFs, cada um numa aba (Ctrl+O)">
            <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 4.5h4.5l1.5 1.5h7v7.5h-13z"/></svg><span class="lbl">Abrir</span>
          </button>
          <button type="button" id="btn-load-marks" title="Carregar marcações (.json)" disabled>
            <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v7.5M5 6.5l3 3 3-3M2.5 11v2.5h11V11"/></svg><span class="lbl">Carregar</span>
          </button>
          <button type="button" id="btn-save" title="Salvar marcações (Ctrl+S)" disabled>
            <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 2.5h9l2 2v9h-11zM5 2.5v3h5.5v-3M5 13.5v-4h6v4"/></svg><span class="lbl">Salvar</span>
          </button>
        </div>

        <div class="sep"></div>

        <div class="cluster file">
          <button type="button" id="btn-merge" title="Montar PDF: juntar e escolher páginas num PDF novo (Ctrl+M)">
            <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 1.5h6l2.5 2.5v8H5zM2.5 4.5v10h8"/></svg><span class="lbl">Montar PDF…</span>
          </button>
        </div>

        <div class="sep"></div>

        <div class="cluster tools" role="toolbar" aria-label="Ferramentas">
          <button type="button" class="tool on" data-tool="select" title="Selecionar e pan (V)">
            <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 2l9 6.2-4 .8-2.2 3.8z"/></svg><span class="lbl">Selecionar</span>
          </button>
          <button type="button" class="tool" data-tool="line" title="Linha (L)">
            <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 12.5l9-9"/><rect x="1.8" y="11" width="3.2" height="3.2"/><rect x="11" y="1.8" width="3.2" height="3.2"/></svg><span class="lbl">Linha</span>
          </button>
          <button type="button" class="tool" data-tool="polyline" title="Polilinha (P)">
            <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 13.5v-5h5.5V3.5h6"/></svg><span class="lbl">Polilinha</span>
          </button>
          <button type="button" class="tool" data-tool="rect" title="Área retangular (R)">
            <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3.5h11v9h-11z"/></svg><span class="lbl">Área</span>
          </button>
          <button type="button" class="tool" data-tool="text" title="Caixa de texto (T)">
            <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4h8M8 4v8.5M1.5 1.5h13v13h-13z"/></svg><span class="lbl">Texto</span>
          </button>
          <button type="button" class="tool" data-tool="highlight" title="Marca-texto: texto ou área livre (H)">
            <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M9.5 2l4.5 4.5-5.5 5.5H4v-4.5zM2 14.5h12"/></svg><span class="lbl">Marca-texto</span>
          </button>
        </div>

        <div class="sep"></div>

        <div class="cluster">
          <button type="button" id="btn-zoom-out" title="Reduzir (Ctrl+−)">−</button>
          <span id="zoom-label" class="quiet">—</span>
          <button type="button" id="btn-zoom-in" title="Ampliar (Ctrl++)">+</button>
          <button type="button" id="btn-fit" title="Ajustar à largura (Ctrl+0)" disabled>
            <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8h13M4.5 5L1.5 8l3 3M11.5 5l3 3-3 3"/></svg><span class="lbl">Ajustar</span>
          </button>
        </div>

        <div class="sep"></div>

        <div class="cluster nav" role="group" aria-label="Páginas">
          <button type="button" id="btn-prev" title="Página anterior (PgUp)" disabled>‹</button>
          <input id="page-input" type="text" inputmode="numeric" autocomplete="off" title="Ir para a página (Enter)" aria-label="Página atual" disabled />
          <span id="page-count" class="quiet">/ —</span>
          <button type="button" id="btn-next" title="Próxima página (PgDn)" disabled>›</button>
          <button type="button" id="btn-mode" title="Navegação contínua · clique para página única" disabled>
            <svg class="ic" id="ic-continuous" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 1v5.5h8V1M4 15V9.5h8V15"/></svg>
            <svg class="ic" id="ic-single" viewBox="0 0 16 16" aria-hidden="true" hidden><path d="M3.5 1.5h9v13h-9z"/></svg>
            <span class="lbl" id="mode-label">Contínuo</span>
          </button>
        </div>

        <div class="spacer"></div>
        <span id="hint" class="hint"></span>
        <div class="themes" role="group" aria-label="Tema">
          <button type="button" data-theme-choice="sepia" title="Tema sépia" aria-label="Tema sépia"></button>
          <button type="button" data-theme-choice="light" title="Tema claro" aria-label="Tema claro"></button>
          <button type="button" data-theme-choice="dark" title="Tema escuro" aria-label="Tema escuro"></button>
        </div>
        <button type="button" id="btn-side" class="on" title="Recolher painel lateral (Ctrl+B)" aria-label="Painel lateral">
          <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 2.5h13v11h-13zM10 2.5v11"/></svg>
        </button>
      </header>

      <nav id="doc-tabs" class="doc-tabs" role="tablist" aria-label="Documentos abertos" hidden></nav>

      <div class="body">
        <main id="stage" tabindex="0">
          <div id="empty">
            <p class="empty-title">Nenhum documento</p>
            <p>
              Abra um PDF. As marcações ficam num arquivo ao lado, sem alterar o original.
            </p>
          </div>
          <div id="pages-host"></div>
        </main>

        <aside id="side" hidden>
          <section>
            <h2>Marcação</h2>
            <p id="sel-kind" class="quiet">Nada selecionado</p>

            <div id="grp-rel">
              <label>
                Origem
                <input id="f-from" type="text" list="list-from" autocomplete="off" />
                <datalist id="list-from"></datalist>
              </label>
              <label>
                Destino
                <input id="f-to" type="text" list="list-to" autocomplete="off" />
                <datalist id="list-to"></datalist>
              </label>
              <label>
                Função
                <input id="f-fn" type="text" list="list-fn" autocomplete="off" />
                <datalist id="list-fn"></datalist>
              </label>
              <label>
                Circuito
                <input id="f-circuit" type="text" list="list-circuit" autocomplete="off" />
                <datalist id="list-circuit"></datalist>
              </label>
              <label>
                Status
                <input id="f-status" type="text" list="status-list" autocomplete="off" />
                <datalist id="status-list">
                  <option value="ok"></option>
                  <option value="pendente"></option>
                  <option value="divergente"></option>
                  <option value="proposto"></option>
                  <option value="existente"></option>
                </datalist>
              </label>
            </div>
            <label id="grp-note">
              Nota
              <textarea id="f-note" rows="3"></textarea>
            </label>
          </section>

          <section class="style">
            <h2 id="style-title">Estilo</h2>
            <div id="grp-text">
              <div class="row">
                <label class="grow">
                  Texto
                  <input id="t-color" type="color" />
                </label>
                <label class="grow">
                  Tamanho (pt)
                  <input id="t-size" type="number" min="4" max="72" step="0.5" />
                </label>
              </div>
              <div class="row">
                <label class="grow">
                  Fundo
                  <input id="t-fill" type="color" />
                </label>
                <label class="grow">
                  Opacidade <output id="t-fill-opacity-val"></output>
                  <input id="t-fill-opacity" type="range" min="0" max="100" step="1" />
                </label>
              </div>
            </div>
            <div class="row">
              <label class="grow">
                <span id="lbl-color">Cor</span>
                <input id="s-color" type="color" />
              </label>
              <label class="grow">
                <span id="lbl-width">Espessura (pt)</span>
                <input id="s-width" type="number" min="0" max="20" step="0.1" />
              </label>
            </div>
            <label>
              <span id="lbl-opacity">Opacidade</span> <output id="s-opacity-val"></output>
              <input id="s-opacity" type="range" min="5" max="100" step="1" />
            </label>
            <div class="swatches" id="swatches"></div>
          </section>

          <section>
            <button type="button" id="btn-delete" class="danger" disabled>Excluir</button>
          </section>
        </aside>
      </div>

      <section id="sheet" hidden>
        <div id="sheet-resizer" class="sheet-resizer" title="Arraste para redimensionar · duplo-clique volta ao tamanho padrão"></div>
        <div class="sheet-tabs" role="tablist" aria-label="Lista de marcações">
          <button type="button" role="tab" data-sheet-tab="line">Linha<span class="count"></span></button>
          <button type="button" role="tab" data-sheet-tab="polyline">Polilinha<span class="count"></span></button>
          <button type="button" role="tab" data-sheet-tab="rect">Área<span class="count"></span></button>
          <button type="button" role="tab" data-sheet-tab="text">Texto<span class="count"></span></button>
          <button type="button" role="tab" data-sheet-tab="highlight">Marca-texto<span class="count"></span></button>
        </div>
        <div class="sheet-scroll" role="tabpanel">
          <table>
            <thead id="sheet-head"></thead>
            <tbody id="sheet-body"></tbody>
          </table>
          <p id="sheet-empty" class="sheet-empty" hidden></p>
        </div>
      </section>
    </div>

    <input id="file-pdf" type="file" accept="application/pdf,.pdf" multiple hidden />
    <input id="file-json" type="file" accept="application/json,.json" hidden />

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
